[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oissyntheticdata"
version = "2.1.0"
description = "Profile-based synthetic data for secure research: a disclosure-safe profile crosses the boundary, the synthesizer never sees the real data. Zero dependencies. An OIS tool."
readme = "README.md"
requires-python = ">=3.7"
license = { file = "LICENSE" }
authors = [{ name = "Yohanan Ouaknine", email = "yohanan.ouaknine@ois.co.il" }]
maintainers = [{ name = "OIS", email = "yohanan.ouaknine@ois.co.il" }]
keywords = [
    "synthetic data", "statistical disclosure control", "privacy",
    "secure research", "microdata", "anonymization", "data profiling",
    "referential integrity", "k-anonymity",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Security",
    "Operating System :: OS Independent",
]
# Runtime dependencies: NONE. Standard library only - this is intentional.
dependencies = []

[project.urls]
Homepage = "https://ois.co.il"
Repository = "https://github.com/yohananouaknine/oissyntheticdata"
Issues = "https://github.com/yohananouaknine/oissyntheticdata/issues"

[project.scripts]
oissyntheticdata = "oissyntheticdata.cli:main"
oissd = "oissyntheticdata.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
