[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "oissyntheticdata"
dynamic = ["version"]                 # read from VERSION in gov_one.py, the single source
description = "Profile a folder of Excel / CSV files into aggregate-only JSON, rebuild synthetic files from the JSON, and run your own statistics script on both. One file, standard library only, offline. An OIS tool."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yohanan Ouaknine", email = "yohanan.ouaknine@ois.co.il" }]
maintainers = [{ name = "OIS", email = "yohanan.ouaknine@ois.co.il" }]
keywords = [
    "synthetic data", "statistical disclosure control", "privacy",
    "secure research", "microdata", "data profiling", "excel",
    "referential integrity", "government data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Security",
    "Operating System :: OS Independent",
]
# Runtime dependencies: NONE. Standard library only - this is intentional.
dependencies = []

[project.urls]
Homepage = "https://ois.co.il"
Repository = "https://github.com/yohananouaknine/oissyntheticdata"
Issues = "https://github.com/yohananouaknine/oissyntheticdata/issues"

[project.scripts]
oissyntheticdata = "oissyntheticdata.cli:main"
oissd = "oissyntheticdata.cli:main"
gov_one = "gov_one:main"

[tool.hatch.version]
path = "gov_one.py"
pattern = "VERSION = 'gov_one (?P<version>[0-9][^ ']*) "

# The wheel holds the single file gov_one.py as a top-level module (so `import gov_one as g`
# works at home exactly as it does on the premises), plus the small oissyntheticdata package.
[tool.hatch.build.targets.wheel]
packages = ["oissyntheticdata"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel.force-include]
"gov_one.py" = "gov_one.py"
"analysis_template.py" = "oissyntheticdata/analysis_template.py"

# The source archive: code, documents, tests and the scripts that invent the demo data.
# The invented data folders themselves are not shipped.
[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
    "/gov_one.py",
    "/analysis_template.py",
    "/oissyntheticdata/*.py",
    "/tests/*.py",
    "/demo/*.py",
    "/demo_suicide/*.py",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]
