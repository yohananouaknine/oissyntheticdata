[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oissyntheticdata"
version = "0.2.0"
description = "Zero-dependency sequential CART synthesis for secure research (synthpop tradition), with relational support. An OIS tool."
readme = "README.md"
requires-python = ">=3.7"
license = { file = "LICENSE" }
authors = [{ name = "Yohanan Ouaknine", email = "yohanan.ouaknine@ois.co.il" }]
maintainers = [{ name = "OIS", email = "yohanan.ouaknine@ois.co.il" }]
keywords = [
    "synthetic data", "synthpop", "statistical disclosure control",
    "CART", "privacy", "secure research", "microdata", "anonymization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Security",
    "Operating System :: OS Independent",
]
# Runtime dependencies: NONE. Standard library only — this is intentional.
dependencies = []

[project.urls]
Homepage = "https://ois.co.il"
Repository = "https://github.com/yohananouaknine/oissyntheticdata"
Issues = "https://github.com/yohananouaknine/oissyntheticdata/issues"

[project.scripts]
oissyntheticdata = "oissyntheticdata.__main__:main"
oissd = "oissyntheticdata.__main__:main"

[tool.setuptools]
packages = ["oissyntheticdata"]
